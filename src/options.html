<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>插件设置</title></head>
  <body><main class="page"><div class="titlebar"><h1>ES 连接设置</h1></div><div id="status" class="status"></div><form id="form" class="form card"><label>ES 地址<input id="es-url" type="url" placeholder="https://es.example.com" required /></label><label>授权 Key<input id="api-key" type="password" required /></label><label>索引前缀<input id="index-prefix" placeholder="bm_company_" required /></label><p class="muted">实际索引名为“索引前缀 + bookmarks”。例如 bm_company_bookmarks。</p><div class="form-actions"><button id="test" type="button" class="secondary">测试连接</button><button type="submit" class="primary">保存配置</button></div></form></main><script type="module" src="./options.ts"></script></body>
</html>
