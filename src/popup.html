<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>ES Bookmark Manager</title></head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <h1>收藏夹</h1>
        <div class="header-actions">
          <button id="add-current" class="icon-button" aria-label="收藏当前地址" title="收藏当前地址"><svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.4 6 .9-4.3 4.2 1 5.9-5.4-2.8-5.4 2.8 1-5.9-4.3-4.2 6-.9L12 3Z"/><circle cx="18" cy="18" r="4"/><path d="M18 16v4M16 18h4"/></svg></button>
          <button id="add-folder" class="icon-button" aria-label="在选中文件夹下创建子文件夹" title="创建子文件夹"><svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z"/><path d="M16 11v6M13 14h6"/></svg></button>
          <button id="search-toggle" class="icon-button" aria-label="搜索文件夹和收藏连接" title="搜索"><svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 5 5"/></svg></button>
          <button id="settings" class="icon-button" aria-label="进入设置页面" title="设置"><svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.7 3.4h4.6l.6 2a7.7 7.7 0 0 1 1.5.9l1.9-.8 2.3 4-1.6 1.4a7.4 7.4 0 0 1 0 1.8l1.6 1.4-2.3 4-1.9-.8a7.7 7.7 0 0 1-1.5.9l-.6 2H9.7l-.6-2a7.7 7.7 0 0 1-1.5-.9l-1.9.8-2.3-4L5 12.7a7.4 7.4 0 0 1 0-1.8L3.4 9.5l2.3-4 1.9.8 1.5-.9.6-2Z"/><circle cx="12" cy="11.8" r="2.7"/></svg></button>
        </div>
      </header>
      <div id="search-bar" class="search-bar hidden"><svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 5 5"/></svg><input id="search-input" placeholder="搜索文件夹、收藏连接" /></div>
      <div id="status" class="status"></div>
      <section id="config-panel" class="popup-config hidden">
        <h2>配置 Elasticsearch</h2>
        <p>首次使用前，请绑定 ES 连接信息。</p>
        <form id="inline-config-form" class="form">
          <label>ES 地址<input id="inline-es-url" type="url" placeholder="https://es.example.com" required /></label>
          <label>授权 Key<input id="inline-api-key" type="password" required /></label>
          <label>索引前缀<input id="inline-index-prefix" placeholder="bookmark_company_" required /></label>
          <div class="form-actions"><button id="inline-config-test" type="button" class="secondary">测试连接</button><button type="submit" class="primary">保存并连接</button></div>
        </form>
      </section>
      <div id="tree" class="tree popup-tree"></div>
      <div id="modal-root"></div>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
